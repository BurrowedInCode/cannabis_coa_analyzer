name: cannabis-coa-analyzer-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coa_test
      POSTGRES_PASSWORD: coa_test_password
      POSTGRES_DB: cannabis_coa_analyzer_test
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coa_test -d cannabis_coa_analyzer_test"]
      interval: 2s
      timeout: 5s
      retries: 15
